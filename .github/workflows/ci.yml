name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.9.8"
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: make check
      - run: make eval
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: |
            EVAL.md
            artifacts/eval.json
